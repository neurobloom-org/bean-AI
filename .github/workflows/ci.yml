name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - develop
      - main

env:
  ENVIRONMENT: test
  DEBUG: "false"
  LOG_LEVEL: INFO
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  SUPABASE_URL: https://dummy.supabase.co
  SUPABASE_ANON_KEY: dummy-anon-key
  SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
  SUPABASE_JWT_SECRET: dummy-jwt-secret
  GOOGLE_API_KEY: dummy-google-api-key
  LLM_CHEAP_MODEL: gemini-2.0-flash
  LLM_PRO_MODEL: gemini-2.5-pro
  GOOGLE_OAUTH_CLIENT_ID: dummy-client-id
  GOOGLE_OAUTH_CLIENT_SECRET: dummy-client-secret
  GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8080/api/v1/auth/google/callback
  OPENAI_API_KEY: sk-dummy
  DEEPGRAM_API_KEY: dummy-deepgram-key
  ELEVENLABS_API_KEY: dummy-elevenlabs-key
  ELEVENLABS_VOICE_ID: dummy-voice-id
  TWILIO_ACCOUNT_SID: ACdummy
  TWILIO_AUTH_TOKEN: dummy-twilio-token
  TWILIO_FROM_NUMBER: "+10000000000"
  TRANSCRIPT_RETENTION_HOURS: "24"
  EMOTION_RETENTION_DAYS: "90"
  EPISODIC_MEMORY_RETENTION_DAYS: "365"
  SESSION_METADATA_RETENTION_DAYS: "730"
  ALERT_THRESHOLD: "3"
  MINOR_ALERT_THRESHOLD: "2"
  GUARDIAN_ALERT_COOLDOWN_SECONDS: "300"
  RATE_LIMIT_WS_MESSAGES_PER_MIN: "60"
  RATE_LIMIT_API_CALLS_PER_MIN: "100"
  RATE_LIMIT_HASH_SALT: "dummy-salt-for-ci"
  OAUTH_STATE_SECRET: "dummy-oauth-secret-for-ci"
  INTERNAL_API_KEY: "dummy-internal-key-for-ci"
  FRONTEND_BASE_URL: "http://localhost:3000"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install --upgrade pip

      - run: pip install -e '.[dev]' --extra-index-url https://download.pytorch.org/whl/cpu

      - run: ruff check .

      - run: ruff format --check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install --upgrade pip

      - run: pip install -e '.[dev]' --extra-index-url https://download.pytorch.org/whl/cpu

      - run: mypy .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install --upgrade pip

      - run: pip install -e '.[dev]' --extra-index-url https://download.pytorch.org/whl/cpu

      - run: pytest tests/ -v --cov=. --cov-report=term-missing