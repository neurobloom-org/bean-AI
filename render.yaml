# ============================================================================
# BEAN AI v1 — Render Deployment
# Two services:
#   1. bean-api       — FastAPI Web Service (WebSocket + HTTP)
#   2. bean-workers   — Background Worker (reminders, purge, cleanup)
# ============================================================================

services:
  # ── Web Service (FastAPI + WebSocket) ──────────────────────────────────────
  - type: web
    name: bean-api
    runtime: python
    plan: starter          # upgrade to standard for production
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "8080"
      # All secrets below — set these in Render dashboard, not here
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: REDIS_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: RUN_BACKGROUND_WORKERS
        value: "false"   # workers run in the separate service below

  # ── Background Worker (reminders, purge, session cleanup) ─────────────────
  - type: worker
    name: bean-workers
    runtime: python
    plan: starter
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
    startCommand: python -m background.worker_main
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUN_BACKGROUND_WORKERS
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false