[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bean-ai"
version = "1.0.0"
description = "BEAN AI — Privacy-First Mental Health Companion Robot API. Supports ESP32-S3 Nano hardware via WebSocket real-time audio pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────────
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "websockets>=12.0,<14.0",
    "httpx>=0.27.0,<1.0.0",

    # ── Supabase & Auth ────────────────────────────────────────────────────────
    "supabase>=2.9.0,<3.0.0",
    "gotrue>=2.9.0,<3.0.0",
    "PyJWT[crypto]>=2.8.0,<3.0.0",
    "cryptography>=42.0.0",

    # ── AI Services ───────────────────────────────────────────────────────────
    "google-genai>=1.0.0,<2.0.0",
    "google-adk>=1.0.0,<2.0.0",
    "openai>=1.40.0,<2.0.0",
    "elevenlabs>=1.3.0,<2.0.0",

    # ── Local Inference (Emotion) ──────────────────────────────────────────────
    # FIX: Added numpy — required by agents/emotion/agent.py (_pcm_b64_to_float_array,
    # _compute_rms, _neutral_prior_probs, _apply_ema, _normalize_probs, etc.)
    # Was missing from the original dependencies list.
    "numpy>=1.26.0,<3.0.0",
    "transformers>=4.44.0,<5.0.0",
    "torch>=2.3.0,<3.0.0",
    "torchaudio>=2.3.0,<3.0.0",

    # ── Integrations & Utilities ───────────────────────────────────────────────
    "twilio>=9.3.0,<10.0.0",
    "pydantic[email]>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "python-dateutil>=2.9.0,<3.0.0",

    # ── Redis ──────────────────────────────────────────────────────────────────
    "redis>=5.0.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",

    # Linting / formatting
    "ruff>=0.6.0",
    "mypy>=1.11.0",

    # Type stubs
    "types-redis>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "background", "services", "shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100