[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bean-ai"
version = "1.0.0"
description = "BEAN AI — Privacy-First Mental Health Companion Robot"
requires-python = ">=3.12"

dependencies = [
    # ── Web framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    # ── Supabase & Auth ──
    "supabase>=2.9.0",
    "gotrue>=2.9.0",
    "PyJWT>=2.8.0",
    # ── AI Services ──
    "google-generativeai>=0.8.0",
    "google-adk>=1.0.0",
    "openai>=1.40.0",
    "deepgram-sdk>=3.5.0",
    "elevenlabs>=1.3.0",
    # ── Local Inference (Emotion) ──
    "transformers>=4.44.0",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    # ── Integrations & Utilities ──
    "twilio>=9.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "agents"]
addopts = "--cov=. --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# ── Enforce CPU-only PyTorch wheels to prevent 2GB CUDA downloads ──
[tool.pip]
extra-index-url = "https://download.pytorch.org/whl/cpu"

# ── Tell hatchling exactly which folders to package ──
[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "api",
    "background",
    "services",
    "shared"
]