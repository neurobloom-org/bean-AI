# ============================================================================
# BEAN AI v1 — Docker Compose (Local Development)
# Note: State lives in Supabase Cloud. Redis runs locally for the hot cache.
# ============================================================================
services:

  # ── Redis — conversation cache + reminder delivery ─────────────────────────
  # FIX: Redis was missing entirely. shared/conversation_cache.py,
  # services/redis_service.py, and background/reminder_check.py all depend on
  # Redis. Without it the app starts but every cache read returns None and
  # reminder delivery is silently degraded.
  redis:
    image: redis:7-alpine
    container_name: bean-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── API server ─────────────────────────────────────────────────────────────
  bean-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    container_name: bean-api

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # Override Redis URL to use the local container, not localhost.
      # The service name "redis" is the hostname inside the Docker network.
      - REDIS_URL=redis://redis:6379

    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.venv

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

volumes:
  redis-data:
    driver: local
