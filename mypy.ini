[mypy]
ignore_missing_imports = True
disallow_untyped_decorators = False
exclude = routing|agents/

# Supabase SDK has no type stubs — suppress import errors only
[mypy-supabase.*]
ignore_missing_imports = True

[mypy-gotrue.*]
ignore_missing_imports = True

# google-adk and google-genai have incomplete stubs
[mypy-google.adk.*]
ignore_missing_imports = True

[mypy-google.genai.*]
ignore_missing_imports = True

# Third-party libs with no stubs
[mypy-elevenlabs.*]
ignore_missing_imports = True

[mypy-websockets.*]
ignore_missing_imports = True

[mypy-twilio.*]
ignore_missing_imports = True

[mypy-deepgram.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True
