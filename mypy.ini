[mypy]
python_version = 3.12
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
# No module exclusions — all packages including agents/ are now type-checked.
# Missing stubs for third-party libraries are handled per-module below.

# Supabase SDK has no type stubs
[mypy-supabase.*]
ignore_missing_imports = true

[mypy-gotrue.*]
ignore_missing_imports = true

# google-adk and google-genai have incomplete stubs
[mypy-google.adk.*]
ignore_missing_imports = true

[mypy-google.genai.*]
ignore_missing_imports = true

# Third-party libs with no stubs
[mypy-elevenlabs.*]
ignore_missing_imports = true

[mypy-websockets.*]
ignore_missing_imports = true

[mypy-twilio.*]
ignore_missing_imports = true

[mypy-deepgram.*]
ignore_missing_imports = true

[mypy-transformers.*]
ignore_missing_imports = true

[mypy-torch.*]
ignore_missing_imports = true

[mypy-torchaudio.*]
ignore_missing_imports = true

[mypy-numpy.*]
ignore_missing_imports = true

[mypy-sklearn.*]
ignore_missing_imports = true
